name: 바이너리 빌드와 릴리스

on:
  pull_request:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: go.mod
          cache: true
      - run: go test ./...

  build:
    needs: test
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - goos: linux
            goarch: amd64
            asset: codex-workflow-linux-x64
          - goos: linux
            goarch: arm64
            asset: codex-workflow-linux-arm64
          - goos: darwin
            goarch: amd64
            asset: codex-workflow-darwin-x64
          - goos: darwin
            goarch: arm64
            asset: codex-workflow-darwin-arm64
          - goos: windows
            goarch: amd64
            asset: codex-workflow-windows-x64.exe
          - goos: windows
            goarch: arm64
            asset: codex-workflow-windows-arm64.exe
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: go.mod
          cache: true
      - name: 바이너리 빌드
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: "0"
          ASSET: ${{ matrix.asset }}
        run: |
          mkdir -p dist
          VERSION="${GITHUB_REF_NAME#v}"
          go build -trimpath -ldflags "-s -w -X main.version=${VERSION}" -o "dist/${ASSET}" ./cmd/codex-workflow
      - name: Linux x64 smoke test
        if: matrix.goos == 'linux' && matrix.goarch == 'amd64'
        env:
          ASSET: ${{ matrix.asset }}
        run: |
          chmod +x "dist/${ASSET}"
          "dist/${ASSET}" --help
          "dist/${ASSET}" version
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ${{ matrix.asset }}
          path: dist/${{ matrix.asset }}
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          path: dist
          merge-multiple: true
      - name: 라이선스 고지 포함
        run: cp LICENSE THIRD_PARTY_NOTICES.md dist/
      - name: SHA-256 생성
        run: |
          cd dist
          for asset in codex-workflow-*; do
            case "$asset" in
              *.sha256) continue ;;
            esac
            sha256sum "$asset" > "$asset.sha256"
          done
      - name: GitHub Release 초안 준비
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "${GITHUB_REF_NAME}" --repo "${GITHUB_REPOSITORY}" >/dev/null 2>&1; then
            gh release edit "${GITHUB_REF_NAME}" --repo "${GITHUB_REPOSITORY}" --draft=true
          else
            gh release create "${GITHUB_REF_NAME}" --repo "${GITHUB_REPOSITORY}" --verify-tag --generate-notes --draft --title "${GITHUB_REF_NAME}"
          fi
      - name: 릴리스 자산 업로드
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${GITHUB_REF_NAME}" dist/* --repo "${GITHUB_REPOSITORY}" --clobber
      - name: GitHub Release 게시
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release edit "${GITHUB_REF_NAME}" --repo "${GITHUB_REPOSITORY}" --draft=false --latest
